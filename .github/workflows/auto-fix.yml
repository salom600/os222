name: 🩹 Auto-Fix Failed Builds

on:
  workflow_run:
    workflows: ["🏗️ Build ISO"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  DEBIAN_FRONTEND: noninteractive
  MAX_FIX_ATTEMPTS: "3"
  FIX_BRANCH_PREFIX: "auto-fix-"

jobs:
  detect-and-fix:
    name: 🔧 Analyze & Patch
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download failed build log
        uses: actions/download-artifact@v4
        with:
          name: build-log-${{ github.event.workflow_run.run_id }}-amd64
          path: ./logs/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        id: dl_log

      - name: Fallback — download all artifacts
        if: steps.dl_log.outputs.download-path == ''
        uses: actions/download-artifact@v4
        with:
          name: build-log-amd64-${{ github.event.workflow_run.run_id }}
          path: ./logs/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Find log file
        id: find_log
        run: |
          set -e
          mkdir -p logs
          for f in $(find logs -type f 2>/dev/null || true); do
            if grep -q -E "ERROR|FAIL|error:|chroot|apt-get" "$f" 2>/dev/null; then
              echo "log=$f" >> $GITHUB_OUTPUT
              echo "Found log: $f"
              break
            fi
          done
          if [ -z "$(cat $GITHUB_OUTPUT 2>/dev/null | grep '^log=' || true)" ]; then
            echo "log=build.log" >> $GITHUB_OUTPUT
            echo "No log found, will use placeholder"
          fi

      - name: Run fix rules
        id: fix
        run: |
          set -e
          chmod +x .github/scripts/auto-fixer.py
          python3 .github/scripts/auto-fixer.py \
            --log "logs/build.log" \
            --repo-root . \
            --output-fix patch.diff \
            --max-attempts "$MAX_FIX_ATTEMPTS" || \
            echo "FIX_RESULT=inconclusive" >> $GITHUB_OUTPUT

          if [ -f patch.diff ] && [ -s patch.diff ]; then
            echo "fix-applied=true" >> $GITHUB_OUTPUT
            head -50 patch.diff
          else
            echo "fix-applied=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config user.name "salomos-bot"
          git config user.email "salomos-bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Create fix branch
        if: steps.fix.outputs.fix-applied == 'true'
        run: |
          BRANCH="${FIX_BRANCH_PREFIX}${{ github.event.workflow_run.run_id }}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b "$BRANCH"

      - name: Apply patch
        if: steps.fix.outputs.fix-applied == 'true'
        run: |
          if git apply --check patch.diff 2>/dev/null; then
            git apply patch.diff
            git add -A
            git commit -m "🩹 auto-fix: detected failure in build #${{ github.event.workflow_run.run_id }}

          The auto-fixer analyzed the build log and applied a heuristic fix.

          🤖 Generated with [SalomOS Auto-Fixer](https://github.com/salom600/os222)
          Co-authored-by: salomos-bot <salomos-bot@users.noreply.github.com>"
            echo "PATCH_APPLIED=true" >> $GITHUB_ENV
          else
            echo "git apply failed; falling back to direct file edits"
            echo "PATCH_APPLIED=false" >> $GITHUB_ENV
          fi

      - name: Push branch
        if: steps.fix.outputs.fix-applied == 'true' && env.PATCH_APPLIED == 'true'
        run: |
          BRANCH="${FIX_BRANCH_PREFIX}${{ github.event.workflow_run.run_id }}"
          git push origin "$BRANCH"

      - name: Open PR
        if: steps.fix.outputs.fix-applied == 'true' && env.PATCH_APPLIED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.FIX_BRANCH_PREFIX + '${{ github.event.workflow_run.run_id }}';
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🩹 Auto-fix for build #${{ github.event.workflow_run.run_id }}',
              head: branch,
              base: 'main',
              body: `## 🤖 Automatic fix
              The build at #${{ github.event.workflow_run.run_id }} failed.
              An AI agent analyzed the log and applied a patch.

              ### What was changed
              See the diff in the \`Files changed\` tab.

              ### Verification
              - [ ] Re-run the build: \`Actions → 🏗️ Build ISO → Run workflow\`
              - [ ] Verify the ISO boots in a VM
              - [ ] Approve and merge if green
              `,
            });
            console.log('Opened PR', pr.data.number);

      - name: Report failure to issue
        if: steps.fix.outputs.fix-applied != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const log = require('fs').readFileSync('logs/build.log', 'utf8').slice(-2000);
            const title = `Build failed: ${{ github.event.workflow_run.head_branch }} @ ${'${{ github.event.workflow_run.head_sha }}'.slice(0,7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-failure,auto-fix-exhausted',
            });
            if (existing.data.find(i => i.title === title)) {
              console.log('Issue already exists, commenting instead');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Build still failing. Last log tail:\n\n\`\`\`\n${log}\n\`\`\``,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `Build at [#${{ github.event.workflow_run.run_id }}](${{ github.event.workflow_run.html_url }}) failed.\n\n` +
                      `Auto-fixer could not produce a patch. Manual intervention required.\n\n` +
                      `### Log tail\n\`\`\`\n${log}\n\`\`\``,
                labels: ['build-failure', 'auto-fix-exhausted'],
              });
            }

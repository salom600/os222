---
# Calamares configuration for SalomOS
# Docs: https://calamares.io/docs/config/

modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

# Modules shown in the install wizard — order matters
sequence:
  - welcome:
      microphoneRequired: false
      requireAcceptance: true
      acceptanceMessage: "I accept the terms and conditions."
  - locale:
      region: "America"
      zone: "Europe/Paris"
      defaultLocale: "en_US.UTF-8"
  - keyboard:
      defaultLayout: "us"
  - partition:
      defaultFileSystem: "btrfs"
      availableFileSystems:
        - btrfs
        - ext4
        - xfs
        - f2fs
        - fat32
      efiPartitionMountPoint: "/boot/efi"
      efiPartitionSize: 512MB
      efiPartitionName: "EFI"
      userSwapChoices:
        - none
        - small
        - suspend
        - file
      warning: |
        ⚠️  SalomOS will be installed on the selected disk. All existing data on it will be erased.
        Please make sure you have backed up anything you need.
  - users:
      autologinGroup: "autologin"
      autologin: false
      doAutologin: false
      setRootPassword: true
      username: "salom"
      password: ""
      hostname: "salomos"
      # Allow the user to set their own password
      allowWeakPasswords: false
      passwordRequirements:
        minLength: 4
        maxLength: -1
  - summary:
      promptInstall: true
  - dracut:
      hostname: "salomos"
  - grub:
      grubInstall: "auto"
      grubConfiguration: "auto"
  - bootloader:
      efiBootloader: "grub-efi"
  - shellprocess:
      timeout: 900
  - displaymanager:
      displayManager: "sddm"
  - finished:
      restartNowEnabled: true
      restartNowChecked: true

branding: salomos
prompt-install: true
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: true
logfiles:
  - /var/log/installer.log
  - /var/log/calamares.log

oem-setup: false
disable-root-cancel: false
window-size: 1180w, 720h
window-icon: /usr/share/calamares/branding/salomos/logo.png

# Modules we don't show
dont-display:
  - "partition*"
  - "dracut*"
  - "bootloader*"
  - "services*"

# Excluded internal Calamares modules
exclude:
  - "umount"

# Reuse installer images in the welcome page
image: /usr/share/calamares/branding/salomos/welcome.png
